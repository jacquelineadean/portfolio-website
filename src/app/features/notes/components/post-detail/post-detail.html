@if (post(); as post) {
  <article class="page container">
    <app-scroll-reveal>
      <a routerLink="/notes" class="back-link">← All notes</a>
    </app-scroll-reveal>

    <app-scroll-reveal [delay]="0.1">
      <header class="post-header">
        <p class="post-meta">
          <time>{{ post.date }}</time>
        </p>
        <h1 class="post-title">{{ post.title }}</h1>
      </header>
    </app-scroll-reveal>

    <app-scroll-reveal [delay]="0.2">
      <div class="prose" [innerHTML]="safeContent()"></div>
    </app-scroll-reveal>

    <app-scroll-reveal [delay]="0.3">
      <div class="post-footer">
        <app-share-buttons [title]="post.title" />
      </div>
    </app-scroll-reveal>
  </article>
} @else {
  <div class="page container">
    <p class="not-found">Post not found.</p>
    <a routerLink="/notes" class="back-link">← All notes</a>
  </div>
}
