<article class="page">
  <div class="container">
    <app-scroll-reveal>
      <a routerLink="/notes" class="back-link">← All notes</a>
    </app-scroll-reveal>

    @if (post; as post) {
      <app-scroll-reveal [delay]="0.1">
        <header class="post-header">
          <h1 class="post-title">{{ post.title }}</h1>
          <p class="post-byline">
            <span>By Jacqueline Dean</span>
            <span aria-hidden="true">·</span>
            <time [attr.datetime]="post.date">{{ post.date }}</time>
          </p>
        </header>
      </app-scroll-reveal>
    }
  </div>

  <!-- Full width: the field guide lays out its own rack and panels. Not inside
       app-scroll-reveal, whose transform would position the article's fixed
       tooltip against it. -->
  <div #article class="article"></div>

  <div class="container">
    <div class="post-footer">
      <app-share-buttons [title]="title" />
    </div>
  </div>
</article>
