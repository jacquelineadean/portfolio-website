<section class="page container about">
  <h1 class="sr-only">About</h1>

  <ul class="reels" role="list">
    @for (reel of reels; track reel.title) {
      <li class="reel" [class.is-wide]="reel.wide">
        @if (reel.specimen; as specimen) {
          <a class="reel-art" [routerLink]="reel.link" tabindex="-1" aria-hidden="true">
            <app-glyphs
              [specimen]="specimen"
              [ratio]="reel.ratio"
              [label]="reel.label"
              [showReadout]="false"
            />
          </a>
        } @else if (reel.video; as video) {
          <app-loop-video
            [src]="video.src"
            [poster]="video.poster"
            [ratio]="'1004 / 640'"
            [label]="reel.label"
            [dark]="true"
          />
        }
        <div class="reel-text">
          <p class="eyebrow reel-kind">{{ reel.kind }}</p>
          <h2 class="reel-title">
            <a [routerLink]="reel.link">{{ reel.title }}</a>
          </h2>
          <p class="reel-caption">{{ reel.caption }}</p>
        </div>
      </li>
    }
  </ul>
</section>
