<footer>
  <div class="footer-inner container">
    <!-- LinkedIn is the only contact route on the site: no address is published
         here or anywhere else, so this link has to carry the whole CTA. -->
    <div class="footer-cta">
      <p class="eyebrow footer-eyebrow">
        <span class="sparkle sparkle--yellow" aria-hidden="true"></span>
        Get in touch
      </p>
      <h2 class="footer-headline">Let's build something <em>durable</em>.</h2>
      <a [href]="links.linkedin" class="footer-contact" target="_blank" rel="noopener noreferrer">
        Find me on LinkedIn
        <span class="contact-arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <div class="footer-grid">
      <div class="footer-col">
        <p class="footer-col-title">Explore</p>
        <nav class="footer-nav">
          <a routerLink="/">Home</a>
          <a routerLink="/about">About</a>
          <a routerLink="/work">Projects</a>
          <a routerLink="/notes">Notes</a>
        </nav>
      </div>

      <div class="footer-col">
        <p class="footer-col-title">Elsewhere</p>
        <nav class="footer-nav">
          <a [href]="links.github" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a [href]="links.linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Jacqueline Dean</p>
      <p class="footer-note">
        Built with curiosity
        <span class="sparkle sparkle--green" aria-hidden="true"></span>
        and Angular
      </p>
    </div>
  </div>
</footer>
