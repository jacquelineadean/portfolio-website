<app-scroll-reveal>
  <div class="section-header" [class.center]="align() === 'center'">
    @if (eyebrow(); as eb) {
      <p class="eyebrow">{{ eb }}</p>
    }
    <h2 class="section-title" [innerHTML]="title()"></h2>
    @if (subtitle(); as sub) {
      <p class="section-subtitle">{{ sub }}</p>
    }
  </div>
</app-scroll-reveal>
