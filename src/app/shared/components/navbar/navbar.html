<nav [class.scrolled]="scrolled()" [class.menu-open]="menuOpen()">
  <div class="nav-inner container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="sparkle sparkle--blue" aria-hidden="true"></span>
      <span class="logo-text">Jacqueline Dean</span>
    </a>

    <button
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div class="nav-links" [class.open]="menuOpen()">
      <ul class="nav-list">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <!-- LinkedIn is the only contact route on the site, so it takes the
           nav's single call to action. -->
      <a
        [href]="linkedInUrl"
        class="nav-cta"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMenu()"
        >LinkedIn</a
      >
    </div>
  </div>
</nav>
